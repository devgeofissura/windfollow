# ventiseg — pan do fluxo de ar: SIMCAM -> ULN2003A -> DM556D 24-36V -> 1 motor
#
# ESQUEMA DE DOCUMENTACAO E EXECUCAO. Renderizar com WireViz 0.4.1:
#   wireviz firmware\ventiseg\docs\wireviz\ventiseg-pan-24v.yaml
#
# GUIA DE EXECUCAO (terminais, ohmimetro, ordem de montagem):
#   docs/LIGACOES.md
# FONTE PRIMARIA: docs/HARDWARE-DECISIONS.md e AGENTS.md (serigrafia do usuario).
# LEGENDA:
#   CONFIRMADO     = registrado pelo usuario na bancada ou nesta revisao;
#   NAO CONFIRMADO = ensaio, etiqueta ou tabela da carcacao (P1-P5);
#   VARIANTE DESENHADA = ANODO COMUM (decisao do usuario em 22/11/2026).
#
# Regra de ouro: VENTISEG_ENABLE_GPIO=0 => firmware serial-only, sem GPIO ativo.
# Nao energizar motor antes de fechar P1-P5 em docs/ESTADO.md.
# NAO HA: laser, rele, fim de curso, tilt nem fonte 12 V neste projeto.
# Existe UMA fonte 5 V, para o VCC do ULN (LEDs D1/D2) e os anodos PUL+/DIR+
# dos optos do DM556D (NAO CONFIRMADO).
# NUNCA ligar GPIO 3,3 V direto nos optos: modulo ULN2003A obrigatorio.

connectors:
  J_GPIO_LIVRES:
    type: "Conector preto 6 pinos — J_GPIO_LIVRES da LILYGO T-SIMCAM"
    subtype: "Serigrafia informada pelo usuario — fonte primaria do ventiseg"
    notes: |-
      Pinos na ordem fisica 1..6:
      (1) IO3/GPIO3 = STEP (PUL). Na SIMCAM e ADC de bateria; sem bateria no
      projeto, liberado para digital/PWM. DIVERGENCIA com a tabela oficial.
      (2) IO46/GPIO46 = RESERVADO: pino de STRAPPING, nao puxar HIGH no boot.
      (3) IO45/GPIO45 = RESERVADO: pino de STRAPPING, define tensao da Flash
      no boot. Nao usar.
      (4) IO21/GPIO21 = DIR. DIVERGENCIA: tabela oficial marca como status do
      modem; prevalece a serigrafia do usuario (HARDWARE-DECISIONS.md).
      (5) GND = referencia logica, comum com o pino GND do ULN2003A, o GND
      5 V, o driver e o ponto unico de terra.
      (6) 3V3 = LIVRE nesta ligacao: o modulo ULN2003A nao usa 3V3. NUNCA ir
      ao driver, ao motor nem aplicar 5 V nos pinos de sinal da placa.
    pinlabels:
      - IO3_STEP
      - IO46_RESERVADO
      - IO45_RESERVADO
      - IO21_DIR
      - GND
      - 3V3_LOGICA

  # ------------------- modulo ULN2003A (decisao do usuario em 22/11/2026)
  J_ULN_IN:
    type: "Modulo ULN2003A — entradas (In1..In7, lado esquerdo da placa)"
    notes: |-
      In1 <- IO3 (STEP), In2 <- IO21 (DIR), GND <- pino 5 da SIMCAM.
      Darlington de coletor aberto: 500 mA por canal; a GPIO fornece apenas
      a corrente de entrada. VCC do modulo vai ao +5 V externo (LEDs D1/D2,
      jumper <-> fechado). O pino 3V3 da SIMCAM fica livre. In3..In7 livres.
    pinlabels: [IN1_STEP, IN2_DIR, GND_ULN, VCC_5V]

  J_ULN_OUT:
    type: "Modulo ULN2003A — saidas (A..G, barra preta a direita)"
    notes: |-
      A -> PUL- do DM556D, B -> DIR- do DM556D. C..G nao conectados.
      com In1/In2 em ALTO, A/B drenam para GND e o opto conduz (anodo comum).
      Inversao: conferir borda de STEP e sentido de DIR no ensaio (P5).
      LEDs D1/D2 acendem com os sinais.
    pinlabels: [A_PUL_N, B_DIR_N]

  J_5V:
    type: "Fonte 5 V para o ULN e os optos do DM556D — NAO CONFIRMADO (P1)"
    notes: |-
      Nao tirar do 3V3 da SIMCAM. Alimenta o VCC do ULN (jumper <-> fechado,
      LEDs D1/D2) e diretamente PUL+/DIR+ do DM556D. Pode vir de regulador
      24 V->5 V; saida auxiliar do driver nao documentada. GND_5V vai ao
      mesmo ponto estrela dos demais GND.
    pinlabels: [V5V, GND_5V]

  # -------------------------------------------------------------- DM556D
  J_DRV_SIG:
    type: "DM556D (Azaneli/Policomp/Tecmaf) — entrada de sinal, ANODO COMUM"
    notes: |-
      VARIANTE DESENHADA: ANODO COMUM (decisao 22/11/2026).
      +5 V externo em PUL+ e DIR+ (anodos); saidas A e B do ULN2003A em
      PUL- e DIR- (catodos). Logo, In1/In2 em ALTO drenam o opto.
      ENA+/ENA- ficam DESCONECTADOS: o driver ja inicia habilitado por
      padrao (informado pelo usuario nesta revisao).
      Corrente dos optos e pulso minimo NAO CONFIRMADOS (P1).
      Conferir se a inversao do ULN trocou o sentido de DIR (P5).
    pinlabels: [PUL_P, PUL_N, DIR_P, DIR_N, ENA_P, ENA_N]

  J_DRV_PWR:
    type: "DM556D — potencia 24-36 VDC e fases do motor"
    notes: |-
      VDC_P/GND_PWR = entrada de potencia (24-36 VDC, minimo 4 A).
      Faixa do driver: 24-50 VDC, corrente 2,1-5,6 A.
      A+/A- e B+/B- = bobinas do motor KTC-HT23-400 em BIPOLAR PARALELA.
      DIP: SW1=OFF SW2=ON SW3=OFF (2,7/2,8 A); SW4=OFF (meia corrente em
      repouso); SW5-SW8 = 1/8 passo (1600 pulsos/volta) — posicoes exatas
      conferir na tabela impressa na carcacao do exemplar (P2).
      NAO CONFIRMADO: fusivel, bitolas e dissipacao (P3).
    pinlabels: [VDC_P, GND_PWR, A_P, A_N, B_P, B_N]

  J_M_PAN:
    type: "Motor KTC-HT23-400 — 8 fios, BIPOLAR PARALELA, 2,8 A, 1,9 Nm"
    notes: |-
      Conexao paralela informada pelo usuario (conferir datasheet/ohmimetro):
      A+ = Vermelho + Preto/Branco; A- = Preto + Vermelho/Branco;
      B+ = Verde + Amarelo/Branco; B- = Amarelo + Verde/Branco.
      Motor gira o conjunto duto + camera (malha fechada de visao).
      Curso util e batentes NAO CONFIRMADOS (P4).
    pinlabels:
      - A_P1
      - A_P2
      - A_N1
      - A_N2
      - B_P1
      - B_P2
      - B_N1
      - B_N2

  J_PSU_24V:
    type: "Fonte externa 24-36 VDC, minimo 4 A — exclusiva do driver/motor"
    notes: |-
      Faixa 24-36 VDC CONFIRMADA como recomendacao de alimentacao; o driver
      aceita 24-50 VDC. NAO CONFIRMADO: potencia exata, fusivel e bitola (P3).
      NUNCA alimentar motor ou driver pelo 3V3/USB da SIMCAM.
      Nunca inverter a polaridade da fonte.
    pinlabels: [VDC_P, GND_PWR]

  J_REF_GND:
    type: "Referencia comum em ponto unico (star ground)"
    notes: |-
      Une em um unico ponto o GND logico da SIMCAM (LOGICO), o GND da fonte
      5 V (AUX5V), o GND do driver (DRIVER) e o negativo da fonte 24 V
      (FONTE). Os `loops` curto-circuitam os 4 pinos; sem eles a referencia
      comum nao fica representada. O pino GND do ULN2003A e os drenos A/B
      usam essa mesma referencia.
    pinlabels: [LOGICO, AUX5V, DRIVER, FONTE]
    loops: [[1, 2], [2, 3], [3, 4]]

cables:
  W_STEP:
    type: "IO3 -> ULN In1 (logica 3,3 V)"
    gauge: 0.25 mm2
    colors: [YE]
    wirelabels: [STEP]
  W_DIR:
    type: "IO21 -> ULN In2 (logica 3,3 V)"
    gauge: 0.25 mm2
    colors: [GY]
    wirelabels: [DIR]
  W_GND_ULN:
    type: "GND da SIMCAM -> pino GND do ULN2003A"
    gauge: 0.25 mm2
    colors: [BK]

  W_V5V_ULN:
    type: "Fonte 5 V -> VCC do ULN (LEDs D1/D2) — NAO CONFIRMADO (P1)"
    gauge: 0.25 mm2
    colors: [OG]
    notes: "Conferir origem do 5 V no manual antes de ligar."
  W_V5V_PUL:
    type: "Fonte 5 V -> PUL+ do DM556D (anodo do opto) — NAO CONFIRMADO (P1)"
    gauge: 0.25 mm2
    colors: [OG]
    wirelabels: [PUL_P]
  W_V5V_DIR:
    type: "Fonte 5 V -> DIR+ do DM556D (anodo do opto) — NAO CONFIRMADO (P1)"
    gauge: 0.25 mm2
    colors: [OG]
    wirelabels: [DIR_P]

  W_PUL_N:
    type: "Saida A do ULN -> DM556D PUL- (anodo comum)"
    gauge: 0.25 mm2
    colors: [BK]
    wirelabels: [PUL_N]
  W_DIR_N:
    type: "Saida B do ULN -> DM556D DIR- (anodo comum)"
    gauge: 0.25 mm2
    colors: [BK]
    wirelabels: [DIR_N]

  W_PSU_P:
    type: "Fonte 24-36 VDC -> DM556D +Vdc"
    gauge: 1.5 mm2
    colors: [RD]
    notes: "Bitola PROVISORIA — dimensionar fusivel e cabos apos P2/P3."
  W_PSU_N:
    type: "Fonte 24-36 VDC -> DM556D GND de potencia"
    gauge: 1.5 mm2
    colors: [BK]
    notes: "Bitola PROVISORIA — NAO CONFIRMADO."

  # Oito condutores individuais: cada par vai junto no mesmo borne do driver.
  W_M_AP1:
    type: "A+ condutor 1 — Vermelho (paralela)"
    gauge: 0.75 mm2
    colors: [RD]
  W_M_AP2:
    type: "A+ condutor 2 — Preto/Branco (paralela)"
    gauge: 0.75 mm2
    colors: [BNWH]
  W_M_AN1:
    type: "A- condutor 1 — Preto (paralela)"
    gauge: 0.75 mm2
    colors: [BN]
  W_M_AN2:
    type: "A- condutor 2 — Vermelho/Branco (paralela)"
    gauge: 0.75 mm2
    colors: [RDWH]
  W_M_BP1:
    type: "B+ condutor 1 — Verde (paralela)"
    gauge: 0.75 mm2
    colors: [GN]
  W_M_BP2:
    type: "B+ condutor 2 — Amarelo/Branco (paralela)"
    gauge: 0.75 mm2
    colors: [YEWH]
  W_M_BN1:
    type: "B- condutor 1 — Amarelo (paralela)"
    gauge: 0.75 mm2
    colors: [YE]
  W_M_BN2:
    type: "B- condutor 2 — Verde/Branco (paralela)"
    gauge: 0.75 mm2
    colors: [GNWH]

  W_REF_LOG:
    type: "GND logico da SIMCAM -> referencia comum"
    colors: [BK]
  W_REF_AUX:
    type: "GND da fonte 5 V -> referencia comum"
    colors: [BK]
  W_REF_DRV:
    type: "GND do driver -> referencia comum"
    colors: [BK]
  W_REF_PSU:
    type: "Negativo da fonte 24 V -> referencia comum"
    colors: [BK]

connections:
  # --- GPIO -> ULN2003A (3,3 V). 3V3 da SIMCAM fica livre.
  - - J_GPIO_LIVRES: [IO3_STEP]
    - W_STEP: [1]
    - J_ULN_IN: [IN1_STEP]
  - - J_GPIO_LIVRES: [IO21_DIR]
    - W_DIR: [1]
    - J_ULN_IN: [IN2_DIR]
  - - J_GPIO_LIVRES: [GND]
    - W_GND_ULN: [1]
    - J_ULN_IN: [GND_ULN]

  # --- 5 V externo -> VCC do ULN e anodos PUL+/DIR+ (ANODO COMUM)
  - - J_5V: [V5V]
    - W_V5V_ULN: [1]
    - J_ULN_IN: [VCC_5V]
  - - J_5V: [V5V]
    - W_V5V_PUL: [1]
    - J_DRV_SIG: [PUL_P]
  - - J_5V: [V5V]
    - W_V5V_DIR: [1]
    - J_DRV_SIG: [DIR_P]

  # --- ULN2003A -> DM556D (A drena PUL-, B drena DIR-)
  - - J_ULN_OUT: [A_PUL_N]
    - W_PUL_N: [1]
    - J_DRV_SIG: [PUL_N]
  - - J_ULN_OUT: [B_DIR_N]
    - W_DIR_N: [1]
    - J_DRV_SIG: [DIR_N]

  # --- ENA desconectado (driver ja inicia habilitado por padrao)
  - - J_DRV_SIG: [ENA_P]
  - - J_DRV_SIG: [ENA_N]

  # --- potencia e fases do motor (bipolar paralela)
  - - J_PSU_24V: [VDC_P]
    - W_PSU_P: [1]
    - J_DRV_PWR: [VDC_P]
  - - J_PSU_24V: [GND_PWR]
    - W_PSU_N: [1]
    - J_DRV_PWR: [GND_PWR]
  - - J_DRV_PWR: [A_P]
    - W_M_AP1: [1]
    - J_M_PAN: [A_P1]
  - - J_DRV_PWR: [A_P]
    - W_M_AP2: [1]
    - J_M_PAN: [A_P2]
  - - J_DRV_PWR: [A_N]
    - W_M_AN1: [1]
    - J_M_PAN: [A_N1]
  - - J_DRV_PWR: [A_N]
    - W_M_AN2: [1]
    - J_M_PAN: [A_N2]
  - - J_DRV_PWR: [B_P]
    - W_M_BP1: [1]
    - J_M_PAN: [B_P1]
  - - J_DRV_PWR: [B_P]
    - W_M_BP2: [1]
    - J_M_PAN: [B_P2]
  - - J_DRV_PWR: [B_N]
    - W_M_BN1: [1]
    - J_M_PAN: [B_N1]
  - - J_DRV_PWR: [B_N]
    - W_M_BN2: [1]
    - J_M_PAN: [B_N2]

  # --- referencia comum em ponto unico
  - - J_GPIO_LIVRES: [GND]
    - W_REF_LOG: [1]
    - J_REF_GND: [LOGICO]
  - - J_5V: [GND_5V]
    - W_REF_AUX: [1]
    - J_REF_GND: [AUX5V]
  - - J_DRV_PWR: [GND_PWR]
    - W_REF_DRV: [1]
    - J_REF_GND: [DRIVER]
  - - J_PSU_24V: [GND_PWR]
    - W_REF_PSU: [1]
    - J_REF_GND: [FONTE]

metadata:
  title: "ventiseg — pan do fluxo de ar (SIMCAM + ULN2003A + DM556D 24-36V, 1 motor)"
  description: |-
    Esquema de documentacao e execucao do ventiseg. Uma unica ESP32-S3
    LILYGO T-SIMCAM detecta a pessoa, comanda o pan e gira, com um unico
    motor KTC-HT23-400, o conjunto duto + camera. Camera e duto giram
    juntos (malha fechada de visao). Modulo ULN2003A em anodo comum entre
    GPIO 3,3 V e os optos do DM556D.
  notes: |-
    CONFIRMADO: placa/flash, pinagem do conector preto (STEP=IO3, DIR=IO21,
    IO45/IO46 reservados, GND, 3V3 livre), logica de 3,3 V, modulo ULN2003A
    (In1/In2/A/B), anodo comum, DM556D (24-50 VDC, 2,1-5,6 A) a 24-36 VDC/
    min 4 A, motor KTC-HT23-400 em bipolar paralela (2,8 A, 1,9 Nm), ENA
    desconectado (driver inicia habilitado), camera acoplada ao duto e
    ausencia de laser, rele, fim de curso e tilt.
    NAO CONFIRMADO: corrente dos optos e pulso minimo, datasheet do modulo
    ULN e jumper dos LEDs, origem do 5 V, inversao de DIR/borda de STEP,
    DIP SW5-SW8 exatos, curso/batentes, fusivel/bitolas, pulso no boot e
    revisao da placa. Firmware mantem 3200 pulsos/volta provisorios; alvo e 1600.
    VARIANTE DESENHADA: anodo comum (+5 V em PUL+/DIR+, ULN drena PUL-/DIR-).
    Documentacao apenas: nenhum GPIO, motor ou fonte foi alterado/energizado.

options:
  color_mode: SHORT
